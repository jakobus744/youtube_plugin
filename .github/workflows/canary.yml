name: Selbsttest
# prueft jede Woche, ob die Selektoren von ytx auf YouTube noch Treffer haben
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm i --no-save playwright-core
      - run: npx playwright-core install --with-deps chromium
      - name: Selbsttest
        id: run
        run: |
          set +e
          node tools/canary.mjs 2>&1 | tee canary.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Issue bei Regression
        if: steps.run.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "ytx Selbsttest: Selektoren ohne Treffer ($(date +%F))" \
            --body "$(printf 'Der wöchentliche Selbsttest hat Selektoren gefunden, die früher trafen und jetzt nicht mehr. Meist hat YouTube etwas umgebaut.\n\n```\n%s\n```\n' "$(tail -40 canary.log)")"
